# Stack that PULLS a prebuilt image instead of building on this host.
# Use this in Portainer when the compose build step fails
# (Podman endpoints, socket proxies, old Docker without BuildKit).
#
# The image is built by GitHub Actions (.github/workflows/docker-publish.yml)
# and published as: ghcr.io/fakezeta/restedxp-reencrypt:latest
#
# NOTE: this file expects to be deployed from the Git repository (the
# ./Caddyfile bind mount resolves inside the cloned checkout). If you paste
# it into the Portainer web editor instead, replace the Caddyfile mount with
# an inline Caddy config or an absolute host path.

services:
  app:
    image: ghcr.io/fakezeta/restedxp-reencrypt:latest
    restart: unless-stopped
    init: true
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
